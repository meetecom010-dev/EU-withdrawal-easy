client_id = "5d7f87aa33802d02b496148727ede58a"
application_url = "https://eu-withdrawal-easy.fly.dev"
embedded = true
name = "Meet: EU withdrawal"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/webhooks/shop/redact"

[app_proxy]
url = "https://eu-withdrawal-easy.fly.dev/proxy/withdrawal-easy"
subpath = "withdrawal-easy"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_locations,read_orders,write_merchant_managed_fulfillment_orders,write_metaobject_definitions,write_metaobjects,write_orders,write_products,write_returns,write_third_party_fulfillment_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ " https://eu-withdrawal-easy.fly.dev/auth" ]

[build]
automatically_update_urls_on_dev = true
