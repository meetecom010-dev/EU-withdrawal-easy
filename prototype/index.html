<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU Withdrawly — Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shopify admin frame emulation: dark top bar + app sidebar + content -->
  <div id="frame">
    <header id="topbar">
      <div class="tb-left">
        <svg class="tb-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.5 3.1c-.2 0-.5.1-.8.2-.3-.7-.8-1.4-1.7-1.4-1.9 0-2.9 2.4-3.2 3.7l-1.5.5c-.5.1-.5.2-.6.6L5 18.7l10.7 2 5.1-1.3s-2-13.5-2-13.7c0-.2-.2-.3-.3-.3l-1.2-.1-.9-1c-.1-.2-.4-.2-.6-.2l-1.3-1zm-2 2.5-1.7.5c.4-1.4 1.1-2.7 2-2.7.3.5-.1 1.4-.3 2.2zm-1.4-3c.3 0 .5.1.7.3-1.1.5-1.9 2-2.3 3.5l-1.4.4c.4-1.5 1.4-4.2 3-4.2z"/></svg>
        <span class="tb-crumb">Apps</span>
        <span class="tb-sep">›</span>
        <span class="tb-app">EU Withdrawly</span>
        <span class="tb-badge">Prototype</span>
      </div>
      <div class="tb-search" role="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M8.5 3a5.5 5.5 0 1 0 3.4 9.8l3.1 3.2a.75.75 0 1 0 1.1-1l-3.2-3.2A5.5 5.5 0 0 0 8.5 3Zm-4 5.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z"/></svg>
        <span>Search</span>
        <kbd>Ctrl K</kbd>
      </div>
      <div class="tb-right">
        <button class="tb-reset" id="reset-demo" title="Reset all demo data">Reset demo</button>
        <div class="tb-store">
          <span class="tb-avatar">NL</span>
          <span class="tb-store-name">Nordlys Living</span>
        </div>
      </div>
    </header>

    <div id="body">
      <nav id="sidebar" aria-label="App navigation">
        <div class="sb-app">
          <span class="sb-app-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--brand)"/><path d="M12 5.6l1.1 2.2 2.4.35-1.75 1.7.4 2.4L12 11.1l-2.15 1.15.4-2.4L8.5 8.15l2.4-.35L12 5.6z" fill="#ffd429"/></svg>
          </span>
          <span>EU Withdrawly</span>
        </div>
        <div class="sb-group" id="nav-admin"></div>
        <div class="sb-label">Storefront previews</div>
        <div class="sb-group" id="nav-preview"></div>
        <div class="sb-foot">
          <div class="sb-label">Demo prototype</div>
          <p>Frontend-only demo with sample data. Nothing here talks to Shopify.</p>
        </div>
      </nav>

      <main id="content" tabindex="-1"></main>
    </div>
  </div>

  <div id="savebar-slot"></div>
  <div id="toast-region" aria-live="polite"></div>
  <div id="modal-slot"></div>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="views-core.js"></script>
  <script src="views-requests.js"></script>
  <script src="views-settings.js"></script>
  <script src="views-preview.js"></script>
  <script src="app.js"></script>
</body>
</html>
